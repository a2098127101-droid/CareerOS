<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Project Copilot · CareerOS</title>
  <link rel="stylesheet" href="/static/career-os.css">
  <link rel="stylesheet" href="/static/production-workspaces.css">
</head>
<body>
<div class="copilot-shell">
  <aside class="copilot-side">
    <a class="brand" href="/projects"><div class="brand-mark">C</div><div class="brand-copy"><strong>CareerOS</strong><span>Project Copilot</span></div></a>
    <a class="btn" href="/projects" style="width:100%;justify-content:flex-start"><i data-lucide="arrow-left"></i><span>返回项目</span></a>
    <div class="nav-scroll">
      <div class="nav-section">当前项目</div>
      <div class="nav-note" id="projectName">未绑定项目</div>
      <div class="nav-section">直接操作</div>
      <button class="nav-item" data-prompt="分析我的职业方向，并明确目前最需要验证的假设"><i data-lucide="compass"></i><span>明确方向</span></button>
      <button class="nav-item" data-prompt="请根据真实经历和目标岗位，生成一版可继续修改的成果"><i data-lucide="file-plus-2"></i><span>生成成果</span></button>
      <button class="nav-item" data-prompt="给当前成果做严格评审，区分致命问题、结构问题和表达问题"><i data-lucide="scan-search"></i><span>严格评审</span></button>
      <button class="nav-item" data-prompt="按评审优先级修订当前成果，不添加未经证实的信息"><i data-lucide="file-pen-line"></i><span>完成修改</span></button>
      <button class="nav-item" id="uploadSide"><i data-lucide="paperclip"></i><span>上传证据</span></button>
    </div>
    <div class="sidebar-bottom"><button class="nav-item" id="logout"><i data-lucide="log-out"></i><span>退出登录</span></button></div>
  </aside>

  <main class="copilot-main">
    <header class="copilot-top">
      <div><strong>Project Copilot</strong><div class="meta" id="modeText">连接中</div></div>
      <span class="badge" id="projectStatus">职业项目</span>
      <div class="top-actions" style="margin-left:auto"><button class="icon-btn" id="uploadTop" aria-label="上传证据"><i data-lucide="paperclip"></i></button><button class="icon-btn" data-theme-toggle aria-label="切换主题"><i data-lucide="sun-moon"></i></button></div>
    </header>
    <div class="copilot-stream" id="messages"></div>
    <div class="copilot-composer">
      <div class="copilot-quick" id="quickActions">
        <button class="quick-chip" data-prompt="分析我的职业方向，并指出还缺少哪些事实">分析方向</button>
        <button class="quick-chip" data-prompt="请根据真实经历和目标岗位，生成一版可继续修改的成果">生成成果</button>
        <button class="quick-chip" data-prompt="给当前成果做严格评审">严格评审</button>
      </div>
      <div class="copilot-composer-box">
        <textarea id="input" rows="3" placeholder="补充真实经历、岗位信息，或直接要求生成、评审、修改…"></textarea>
        <div class="copilot-tools"><button class="btn small" id="attach"><i data-lucide="paperclip"></i>证据</button><span class="meta">不会把未确认信息写成事实</span><button class="send-btn" id="send" aria-label="发送"><i data-lucide="arrow-up"></i></button></div>
      </div>
    </div>
  </main>

  <aside class="copilot-inspector">
    <section class="copilot-task" id="taskCard"><div class="eyebrow">当前任务</div><h2 id="taskTitle">加载中</h2><p id="taskDescription">正在判断项目下一步。</p><button class="btn primary" id="taskButton" style="width:100%">继续</button></section>
    <section class="inspector-section"><div class="eyebrow">项目进度</div><div class="mini-stat"><span>当前阶段</span><strong id="stageText">—</strong></div><div class="mini-stat"><span>完成度</span><strong id="progressText">—</strong></div><div class="progress-line" style="margin-top:12px"><i id="progressBar" style="width:0"></i></div></section>
    <section class="inspector-section"><div class="eyebrow">当前成果</div><div id="artifactBox" class="meta" style="margin-top:10px">尚未生成</div><div id="artifactActions" style="display:none;gap:7px;margin-top:10px"><button class="btn small" id="copyArtifact"><i data-lucide="copy"></i>复制</button><button class="btn small" id="downloadArtifact"><i data-lucide="download"></i>导出</button></div></section>
    <section class="inspector-section"><div class="eyebrow">评审</div><div class="mini-stat"><span>当前分数</span><strong id="scoreText">—</strong></div><div id="reviewNote" class="meta" style="margin-top:10px">完成评审后显示关键问题。</div></section>
    <section class="inspector-section"><div class="eyebrow">会话</div><div class="meta" id="sessionText" style="margin-top:8px;word-break:break-all">—</div></section>
    <button class="btn" id="completeProject" style="width:100%;display:none"><i data-lucide="circle-check-big"></i>标记项目完成</button>
  </aside>
</div>
<nav class="mobile-nav copilot-mobile-nav" aria-label="移动端导航"><a href="/projects"><i data-lucide="folder-kanban"></i><span>项目</span></a><button data-prompt="请根据真实经历和目标岗位，生成一版可继续修改的成果"><i data-lucide="file-plus-2"></i><span>生成</span></button><button data-prompt="给当前成果做严格评审"><i data-lucide="scan-search"></i><span>评审</span></button><button id="mobileUpload"><i data-lucide="paperclip"></i><span>证据</span></button></nav>
<input type="file" id="file" hidden accept=".docx,.pdf,.txt,.md,.json,.csv">
<div class="toast-stack" id="toastStack"></div>
<script src="/static/vendor/lucide.min.js"></script><script src="/static/ui.js"></script>
<script>
const $=selector=>document.querySelector(selector);
const params=new URLSearchParams(location.search);
const projectId=params.get('project_id')||'';
let sessionId=params.get('session_id')||safeGet('cc_student_session');
let state=null,workflow=null,artifacts=[],project=null,thinking=false;
const statusLabel={draft:'尚未开始',collecting:'补充资料',ready_to_generate:'可以生成',solution_generated:'等待评审',reviewed:'进入修改',revision_required:'必须修改',completed:'已完成'};
function safeGet(key){try{return localStorage.getItem(key)||''}catch{return''}}
function safeSet(key,value){try{localStorage.setItem(key,value)}catch{}}
function esc(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function md(value=''){return esc(value).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function toast(message,icon='check'){CareerUI.toast(message,icon)}
async function api(url,opt={}){
  const headers=opt.body instanceof FormData?{}:(opt.body?{'Content-Type':'application/json'}:{});
  const response=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});
  const data=await response.json().catch(()=>({}));
  if(response.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);throw new Error('请先登录')}
  if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'请求失败');
  return data;
}
function currentArtifactText(){return state?.revised_draft||state?.draft||''}
function actionCard(message){
  if(message.action==='draft')return `<div class="artifact-summary"><strong>第一版成果已生成</strong><p class="meta">下一步不是继续堆内容，而是检查事实、岗位匹配与结构。</p><button class="btn small" data-prompt="给当前成果做严格评审">开始评审</button></div>`;
  if(message.action==='review'&&state?.review)return `<div class="artifact-summary"><strong>严格评审：${esc(state.review.total_score)}/100</strong><p class="meta">${esc((state.review.revision_priority||[])[0]||'根据评审意见完成必要修改。')}</p><button class="btn small primary" data-prompt="按评审优先级修订当前成果，不添加未经证实的信息">开始修改</button></div>`;
  if(message.action==='revise')return `<div class="artifact-summary"><strong>修订版已生成</strong><p class="meta">请人工核对事实、数字和岗位名称后再使用。</p></div>`;
  return '';
}
function renderMessages(){
  const messages=state?.messages||[];
  if(!messages.length){$('#messages').innerHTML=`<div class="copilot-message"><div class="copilot-bubble"><strong>先处理一个明确任务。</strong><p>补充真实经历、目标岗位或现有简历。系统会把材料组织成项目证据，再生成可评审、可修改的成果。</p></div></div>`;return}
  $('#messages').innerHTML=messages.map(message=>`<div class="copilot-message ${message.role==='user'?'user':'assistant'}"><div class="copilot-bubble">${md(message.content)}${message.role==='assistant'?actionCard(message):''}</div></div>`).join('')+(thinking?`<div class="copilot-message"><div class="copilot-bubble"><span class="meta">正在读取项目材料并执行当前任务…</span></div></div>`:'');
  $('#messages').scrollTop=$('#messages').scrollHeight;CareerUI.refreshIcons();
}
function renderInspector(){
  const action=project?.next_action||{title:'继续当前职业项目',description:'补充材料或执行当前任务。',cta:'继续',href:'#'};
  $('#projectName').textContent=project?.name||'未绑定项目';$('#projectStatus').textContent=statusLabel[project?.status]||'职业项目';
  $('#taskTitle').textContent=action.title||'继续项目';$('#taskDescription').textContent=action.description||'';$('#taskButton').textContent=action.cta||'继续';
  $('#taskButton').onclick=()=>{const href=action.href||'#';if(href.startsWith('/student'))$('#input').focus();else location.href=href};
  const progress=project?.progress||workflow||{};const percent=Number(progress.percent??workflow?.progress??0)||0;
  $('#stageText').textContent=project?.progress?.steps?.find(x=>x.status==='current')?.label||workflow?.current_step?.label||state?.stage||'建立资料';
  $('#progressText').textContent=`${Math.round(percent)}%`;$('#progressBar').style.width=`${Math.max(0,Math.min(100,percent))}%`;
  const text=currentArtifactText();
  if(text){$('#artifactBox').innerHTML=`<strong>${esc(state.document_type||'职业成果')}</strong><div class="meta" style="margin-top:4px">${state.revised_draft?'修订版':'初稿'} · ${text.length} 字</div>`;$('#artifactActions').style.display='flex'}else{$('#artifactBox').textContent='尚未生成';$('#artifactActions').style.display='none'}
  const score=state?.review?.total_score;$('#scoreText').textContent=score==null?'—':`${score}/100`;$('#reviewNote').textContent=state?.review?.revision_priority?.[0]||'完成评审后显示关键问题。';
  $('#sessionText').textContent=sessionId||'—';$('#completeProject').style.display=project&&['reviewed','revision_required'].includes(project.status)?'inline-flex':'none';
}
async function refreshProject(){
  if(!projectId)return;
  try{project=await api('/api/v1/projects/'+encodeURIComponent(projectId))}catch(error){toast(error.message,'triangle-alert')}
}
async function refreshState(){
  if(!sessionId)return;
  const results=await Promise.allSettled([api('/api/sessions/'+encodeURIComponent(sessionId)),api('/api/sessions/'+encodeURIComponent(sessionId)+'/workflow'),api('/api/sessions/'+encodeURIComponent(sessionId)+'/artifacts')]);
  if(results[0].status==='fulfilled')state=results[0].value;else throw results[0].reason;
  workflow=results[1].status==='fulfilled'?results[1].value:null;artifacts=results[2].status==='fulfilled'?(results[2].value.artifacts||[]):[];
}
async function updateMilestone(action){
  if(!projectId)return;
  let milestone='';
  if(action==='draft')milestone='generated';
  if(action==='review')milestone=(Number(state?.review?.total_score||0)<70?'revision_required':'reviewed');
  if(action==='revise')milestone='reviewed';
  if(!milestone)return;
  try{const result=await api(`/api/v1/projects/${encodeURIComponent(projectId)}/milestone?milestone=${encodeURIComponent(milestone)}`,{method:'PATCH'});project=result.project}catch(error){toast(`项目状态未同步：${error.message}`,'triangle-alert')}
}
async function sendMessage(raw){
  const text=(raw??$('#input').value).trim();if(!text||thinking)return;
  $('#input').value='';state.messages=state.messages||[];state.messages.push({role:'user',content:text});thinking=true;renderMessages();$('#send').disabled=true;
  try{const result=await api('/api/chat',{method:'POST',body:JSON.stringify({session_id:sessionId,message:text})});state=result.state;workflow=result.workflow||workflow;await updateMilestone(result.action);await Promise.all([refreshState(),refreshProject()]);renderMessages();renderInspector()}
  catch(error){state.messages.pop();toast(error.message,'triangle-alert');renderMessages()}
  finally{thinking=false;$('#send').disabled=false;renderMessages()}
}
function chooseFile(){$('#file').click()}
async function uploadFile(file){
  const form=new FormData();form.append('file',file);form.append('session_id',sessionId);toast('正在读取证据','loader-circle');
  const result=await api('/api/files/parse',{method:'POST',body:form});await sendMessage(`我上传了材料《${result.filename}》。请把它作为事实证据读取，先识别可核验信息和仍需确认的内容：\n\n${result.text.slice(0,18000)}`);
}
async function init(){
  try{
    const health=await api('/api/health');$('#modeText').textContent=health.mode==='demo'?'Demo 数据模式':health.mode==='hybrid'?'Hybrid Agents':'Live Agents';
    if(projectId){project=await api('/api/v1/projects/'+encodeURIComponent(projectId));sessionId=project.session_id||sessionId}
    if(sessionId){try{await refreshState()}catch{sessionId=''}}
    if(!sessionId){state=await api('/api/sessions',{method:'POST',body:'{}'});sessionId=state.session_id}
    safeSet('cc_student_session',sessionId);await Promise.all([refreshState(),refreshProject()]);renderMessages();renderInspector();CareerUI.refreshIcons();
  }catch(error){toast(error.message,'triangle-alert')}
}
document.addEventListener('click',event=>{const prompt=event.target.closest('[data-prompt]');if(prompt){sendMessage(prompt.dataset.prompt);return}});
$('#send').onclick=()=>sendMessage();$('#input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}});
[$('#attach'),$('#uploadSide'),$('#uploadTop'),$('#mobileUpload')].forEach(button=>button.onclick=chooseFile);
$('#file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{await uploadFile(file)}catch(error){toast(error.message,'triangle-alert')}event.target.value=''};
$('#copyArtifact').onclick=async()=>{await navigator.clipboard.writeText(currentArtifactText());toast('已复制成果')};
$('#downloadArtifact').onclick=()=>{const text=currentArtifactText();if(!text)return;const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));link.download=`${state.document_type||'职业成果'}_${state.revised_draft?'修订版':'初稿'}.txt`;link.click();URL.revokeObjectURL(link.href)};
$('#completeProject').onclick=async()=>{try{const result=await api(`/api/v1/projects/${encodeURIComponent(projectId)}/milestone?milestone=completed`,{method:'PATCH'});project=result.project;toast('项目已完成');renderInspector()}catch(error){toast(error.message,'triangle-alert')}};
$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});location.href='/login'}catch(error){toast(error.message,'triangle-alert')}};
CareerUI.initTheme();CareerUI.refreshIcons();init();
</script>
</body>
</html>
