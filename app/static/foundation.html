<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StepIn · 今天先做这一小步</title>
  <style>
    :root{--bg:#f6f5f1;--paper:#fffefa;--ink:#1f2924;--muted:#69736d;--line:#dddcd5;--accent:#315d4d;--accent2:#e8f0ec;--warn:#8a5d24;--bad:#9d3737;--good:#2f6b50}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,textarea,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:184px minmax(0,760px) minmax(220px,300px);gap:28px;justify-content:center;padding:28px}
    .nav{padding:10px 0}.brand{font-weight:750;font-size:20px;margin-bottom:30px}.nav a{display:block;color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:10px;margin:4px 0}.nav a.active{background:#ecebe5;color:var(--ink);font-weight:650}
    .stage{background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:calc(100vh - 56px);padding:34px 38px;box-shadow:0 8px 30px rgba(35,44,38,.04)}
    .eyebrow{color:var(--muted);font-size:13px}.title{font-size:30px;line-height:1.25;margin:8px 0 10px;letter-spacing:-.02em}.intro{font-size:17px;margin:0 0 9px}.why{color:var(--muted);margin:0 0 28px}.progress{height:5px;background:#e7e5df;border-radius:99px;overflow:hidden;margin:16px 0 30px}.progress>i{display:block;height:100%;background:var(--accent);width:0}
    .card{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:10px 0;background:#fff}.card.click{cursor:pointer}.card.click:hover{border-color:#9ca9a1}.card.selected{border-color:var(--accent);background:var(--accent2)}
    .detail{color:var(--muted);font-size:13px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field textarea,.field input,.field select{width:100%;border:1px solid #cbc9c1;border-radius:10px;background:#fff;padding:11px 12px;outline:none}.field textarea{min-height:110px;resize:vertical}.field textarea:focus,.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,93,77,.09)}
    .actions{display:flex;gap:10px;align-items:center;margin-top:26px;flex-wrap:wrap}.btn{border:1px solid #c9c8c0;background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{margin-top:14px;padding:12px 14px;background:#f3efe4;border-radius:10px;color:#5f5235}.message{margin:16px 0 0;padding:12px 14px;border-radius:10px;display:none}.message.show{display:block}.message.bad{background:#f7eaea;color:var(--bad)}.message.good{background:#eaf4ee;color:var(--good)}
    .side{padding-top:70px}.side h3{font-size:14px;margin:0 0 10px}.ability{padding:9px 0;border-bottom:1px solid var(--line)}.ability b{display:block;font-size:13px}.ability span{color:var(--muted);font-size:12px}.trail{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.trail strong{color:var(--ink)}
    .rank-row{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:start}.rank-row select{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.option-line{display:flex;gap:10px;align-items:flex-start}.option-line input{margin-top:5px}.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:#ecebe5;color:#58615c;margin-right:6px}.ready{text-align:center;padding:80px 20px}.ready .title{font-size:34px}.small{font-size:12px;color:var(--muted)}
    @media(max-width:980px){.shell{grid-template-columns:1fr;padding:14px}.nav{display:flex;gap:6px;align-items:center}.brand{margin:0 auto 0 0}.nav a{display:inline-block}.side{padding:0}.stage{min-height:auto;padding:24px 20px}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <nav class="nav"><div class="brand">StepIn</div><a class="active" href="/static/foundation.html">今天</a><a href="/projects">练习</a><a href="/student">作品</a></nav>
  <main class="stage" id="stage"><div class="eyebrow">正在准备今天这一步…</div></main>
  <aside class="side"><h3>我正在学会做什么</h3><div id="abilities"></div><div class="trail"><strong>做</strong> → 改 → 再做一次 → 成果<br><span id="trailText">先做眼前这一小步。</span></div></aside>
</div>
<script>
const API='/api/foundation/v1';
let summary=null, current=null, answer={};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function req(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){location.href='/login?next=/static/foundation.html';throw new Error('请先登录');}const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data?.detail?.message||data?.detail||`请求失败 ${r.status}`);return data}
function progress(){return Math.round(Number(summary?.progress||0)*100)}
function renderAbilities(){const box=$('#abilities'); if(!box)return; const items=(summary?.abilities||[]).filter(x=>x.attempts||x.laterPracticeCount).slice(0,6);box.innerHTML=items.length?items.map(x=>`<div class="ability"><b>${esc(x.name||x.id)}</b><span>${esc(x.level||'刚开始')}</span></div>`).join(''):'<div class="small">做过的事情会慢慢记在这里。</div>'}
function message(text,good=false){const el=$('#msg');if(!el)return;el.className='message show '+(good?'good':'bad');el.textContent=Array.isArray(text)?text.join('；'):text}
function buttonCards(items,selected,multi=false){return (items||[]).map(x=>`<label class="card click ${selected?.includes?.(x.id)||selected===x.id?'selected':''}"><div class="option-line"><input type="${multi?'checkbox':'radio'}" name="choice" value="${esc(x.id)}" ${selected?.includes?.(x.id)||selected===x.id?'checked':''}><div><b>${esc(x.title||x.text)}</b>${x.detail?`<div class="detail">${esc(x.detail)}</div>`:''}</div></div></label>`).join('')}
function renderTask(t){current=t;answer={};const d=t.data||{};let body='';
 if(t.type==='order'){body=(d.items||[]).map((x,i)=>`<div class="card rank-row"><select data-rank="${esc(x.id)}">${[1,2,3,4].map(n=>`<option ${n===i+1?'selected':''}>${n}</option>`).join('')}</select><div><b>${esc(x.title)}</b><div class="detail">${esc(x.detail)}</div></div></div>`).join('')+`<div class="field"><label>为什么这样排？</label><textarea id="reason" placeholder="用自己的话说一句就可以。"></textarea></div>`}
 else if(t.type==='select'){body=`<p>${esc(d.question||'')}</p>`+buttonCards(d.items,[],true)}
 else if(t.type==='categorize'){body=(d.items||[]).map(x=>`<div class="card"><div>${esc(x.text)}</div><div class="field"><select data-map="${esc(x.id)}"><option value="">放到…</option>${(d.categories||[]).map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div>`).join('')}
 else if(t.type==='spot_issues'){body=`<div class="grid2">${(d.rows||[]).map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="detail">${esc(r.phone||'电话为空')} · ${esc(r.date)}</div></div>`).join('')}</div><div class="field"><label>你看到了哪些问题？</label>${buttonCards(d.issues,[],true)}</div><div class="field"><label>为什么这些会影响后面的工作？</label><textarea id="reason"></textarea></div>`}
 else if(t.type==='handoff'){body=`<div class="card">${esc(d.situation)}</div>`+(d.fields||[]).map(f=>`<div class="field"><label>${esc(f.label)}</label><textarea data-field="${esc(f.id)}" placeholder="${esc(f.placeholder||'')}"></textarea></div>`).join('')}
 else if(t.type==='revise'){body=`<div class="card"><span class="pill">第一版</span>${esc(d.original)}</div><div class="card"><span class="pill">收到的意见</span>${esc(d.feedback)}</div><div class="field"><label>改成第二版</label><textarea id="revised"></textarea></div><div class="field"><label>这次主要改了什么？</label><textarea id="changeReason"></textarea></div>`}
 else if(t.type==='transfer'){body=`<p>${esc(d.question)}</p>`+buttonCards(d.items,[],false)+`<div class="field"><label>为什么先做它？</label><textarea id="reason"></textarea></div>`}
 else if(t.type==='mini_project'){body=`<div class="card"><b>现在的情况</b><div class="detail">${esc(d.brief)}</div></div><div class="field"><label>先选出真正影响处理的重点</label>${buttonCards(d.facts,[],true)}</div><div class="field"><label>你准备先处理什么？为什么？</label><textarea id="decision"></textarea></div><div class="field"><label>最后把处理结果交代给下一位</label><textarea id="handoff"></textarea></div>`}
 $('#stage').innerHTML=`<div class="eyebrow">基础练习 · ${summary.completed+1}/${summary.total}</div><h1 class="title">${esc(t.title)}</h1><p class="intro">${esc(t.intro)}</p><p class="why">${esc(t.why)}</p><div class="progress"><i style="width:${progress()}%"></i></div>${body}<div id="hint" class="hint" style="display:none"></div><div id="msg" class="message"></div><div class="actions">${Number(t.hintBudget||0)>0?'<button class="btn" id="hintBtn">给一点提示</button>':''}<button class="btn primary" id="doneBtn">完成这一步</button></div>`;
 $('#hintBtn')?.addEventListener('click',getHint); $('#doneBtn').addEventListener('click',completeTask);
}
function collectTaskAnswer(){const t=current,d=t.data||{};if(t.type==='order'){return{order:[...document.querySelectorAll('[data-rank]')].sort((a,b)=>Number(a.value)-Number(b.value)).map(x=>x.dataset.rank),reason:$('#reason').value}}
 if(t.type==='select')return{selected:[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value)};
 if(t.type==='categorize')return{mapping:Object.fromEntries([...document.querySelectorAll('[data-map]')].map(x=>[x.dataset.map,x.value]))};
 if(t.type==='spot_issues')return{selected:[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),reason:$('#reason').value};
 if(t.type==='handoff')return{fields:Object.fromEntries([...document.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]))};
 if(t.type==='revise')return{revised:$('#revised').value,changeReason:$('#changeReason').value};
 if(t.type==='transfer')return{choice:document.querySelector('input[name=choice]:checked')?.value||'',reason:$('#reason').value};
 if(t.type==='mini_project')return{keyFactIds:[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),decision:$('#decision').value,handoff:$('#handoff').value}; return{}}
async function getHint(){try{const d=await req(`${API}/tasks/${current.id}/hint`,{method:'POST'});const el=$('#hint');el.style.display='block';el.textContent=d.message||'先只看眼前这一小步。'}catch(e){message(e.message)}}
async function completeTask(){const b=$('#doneBtn');b.disabled=true;try{const d=await req(`${API}/tasks/${current.id}/complete`,{method:'POST',body:JSON.stringify({answer:collectTaskAnswer()})});if(!d.ok){message(d.issues||'这一步还差一点');return}message('这一步完成了。',true);setTimeout(load,450)}catch(e){message(e.message)}finally{b.disabled=false}}
function renderExpression(){current=null;$('#stage').innerHTML=`<div class="eyebrow">基础练习完成</div><h1 class="title">把刚才做过的事情讲清楚</h1><p class="intro">不用写漂亮话。说清楚你做了什么、怎么判断、哪里改过。</p><div class="progress"><i style="width:100%"></i></div><div class="field"><label>用自己的话复盘一次</label><textarea id="reflection" placeholder="我先……后来发现……收到意见后我改了……"></textarea></div><div id="msg" class="message"></div><div class="actions"><button class="btn primary" id="expressionBtn">保存这次复盘</button></div>`;$('#expressionBtn').onclick=saveExpression}
async function saveExpression(){try{const r=$('#reflection').value.trim();if(r.length<30){message('再具体一点，至少说清楚做了什么和怎么改的。');return}await req(`${API}/expression`,{method:'POST',body:JSON.stringify({reflection:r})});message('已经记下。接下来换三种材料试试看。',true);setTimeout(load,500)}catch(e){message(e.message)}}
function renderExploration(exp){const t=exp.next;if(!t){load();return}current=t;const d=t.data||{};let body='';if(t.type==='select'){body=`<p>${esc(d.question)}</p>`+buttonCards(d.items,[],true)}else if(t.type==='choice_reason'){body=`<p>${esc(d.question)}</p>`+buttonCards(d.items,[],false)+`<div class="field"><label>为什么？</label><textarea id="reason"></textarea></div>`}else{body=`<div class="card">${esc(d.situation)}</div><div class="field"><label>交代给下一位</label><textarea id="exploreText" placeholder="${esc(d.placeholder||'')}"></textarea></div>`}$('#stage').innerHTML=`<div class="eyebrow">换一种事情试试看 · ${exp.completed+1}/${exp.total}</div><h1 class="title">${esc(t.title)}</h1><p class="intro">${esc(t.intro)}</p><div class="progress"><i style="width:${Math.round(exp.completed/exp.total*100)}%"></i></div>${body}<div id="msg" class="message"></div><div class="actions"><button class="btn primary" id="exploreBtn">完成这一次</button></div>`;$('#exploreBtn').onclick=completeExploration}
async function completeExploration(){const t=current;let a={};if(t.type==='select')a={selected:[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value)};else if(t.type==='choice_reason')a={choice:document.querySelector('input[name=choice]:checked')?.value||'',reason:$('#reason').value};else a={text:$('#exploreText').value};try{const d=await req(`${API}/explorations/${t.id}/complete`,{method:'POST',body:JSON.stringify({answer:a})});if(!d.ok){message(d.issues||'再看一次');return}message('完成。再换一种材料。',true);setTimeout(load,450)}catch(e){message(e.message)}}
function renderReady(){current=null;$('#stage').innerHTML=`<div class="ready"><div class="eyebrow">基础阶段完成</div><h1 class="title">现在可以继续往前了</h1><p class="intro">你已经做过基础任务、改过一版，也换了三种材料自己做过。</p><p class="why">下一步才开始接触更完整的职业实践，不需要先证明自己“适合”哪个岗位。</p><div class="actions" style="justify-content:center"><a class="btn primary" href="/projects" style="text-decoration:none">进入下一阶段</a></div></div>`}
async function load(){try{summary=await req(`${API}/me`);renderAbilities();$('#trailText').textContent=summary.professionalUnlocked?'基础阶段已经走完。':summary.foundationComplete?'基础动作已经做完，继续把它讲出来并换材料再做。':`已完成 ${summary.completed}/${summary.total} 个小步骤。`;if(summary.professionalUnlocked){renderReady();return}if(summary.mode==='exploration'){renderExploration(summary.exploration);return}if(summary.foundationComplete){renderExpression();return}const id=summary.currentTask?.id;if(!id)throw new Error('没有找到当前任务');const d=await req(`${API}/tasks/${id}`);renderTask(d.task)}catch(e){$('#stage').innerHTML=`<h1 class="title">暂时打不开这一步</h1><p>${esc(e.message)}</p><p><a href="/login">重新登录</a></p>`}}
load();
</script>
</body></html>
