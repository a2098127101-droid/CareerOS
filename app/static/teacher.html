<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>教师运营中心 · CareerOS</title>
  <link rel="stylesheet" href="/static/career-os.css">
  <link rel="stylesheet" href="/static/production-workspaces.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/teacher"><div class="brand-mark">C</div><div class="brand-copy"><strong>CareerOS</strong><span>教师运营中心</span></div></a>
    <div class="nav-scroll">
      <div class="nav-section">运营</div>
      <a class="nav-item active" href="#queue"><i data-lucide="list-todo"></i><span>干预队列</span><span class="count" id="queueCount">0</span></a>
      <a class="nav-item" href="#metrics"><i data-lucide="chart-no-axes-combined"></i><span>班级进度</span></a>
      <a class="nav-item" href="#queue"><i data-lucide="file-check-2"></i><span>待评审成果</span></a>
      <div class="nav-section">治理</div>
      <a class="nav-item" href="/static/governance.html"><i data-lucide="gauge"></i><span>AI成本与审计</span></a>
      <a class="nav-item" href="/admin"><i data-lucide="library"></i><span>模型与知识库</span></a>
      <div class="nav-section">工作原则</div>
      <div class="nav-note">优先处理需要人工判断的学生，而不是逐个浏览全部用户。</div>
    </div>
    <div class="sidebar-bottom"><button class="nav-item" id="logout"><i data-lucide="log-out"></i><span>退出登录</span></button><div class="user-row"><div class="avatar" id="advisorAvatar">A</div><div class="user-meta"><strong id="advisorName">Advisor</strong><span>Advisor Workspace</span></div></div></div>
  </aside>
  <header class="topbar"><div class="breadcrumb">CareerOS / <b>教师运营中心</b></div><div class="top-actions" style="margin-left:auto"><span class="badge" id="mode">连接中</span><button class="icon-btn" id="refresh" aria-label="刷新"><i data-lucide="refresh-cw"></i></button><button class="icon-btn" data-theme-toggle aria-label="切换主题"><i data-lucide="sun-moon"></i></button><div class="avatar" id="topAvatar">A</div></div></header>
  <main class="main"><div class="operations-main">
    <div class="page-head"><div><div class="eyebrow" id="today">Today</div><h1>需要人工处理的事项</h1><p>队列由项目状态、关键资料缺口、成果评审与停滞时间共同生成。</p></div><div class="page-actions"><button class="btn" id="createGeneralTask"><i data-lucide="plus"></i>新建运营任务</button></div></div>
    <section class="operations-kpis" id="metrics">
      <div class="operation-kpi"><span>活跃学生</span><strong id="mStudents">—</strong></div>
      <div class="operation-kpi"><span>需要关注</span><strong id="mAttention">—</strong></div>
      <div class="operation-kpi"><span>资料已完整</span><strong id="mReady">—</strong></div>
      <div class="operation-kpi"><span>等待评审</span><strong id="mReview">—</strong></div>
      <div class="operation-kpi"><span>必须修改</span><strong id="mRevision">—</strong></div>
      <div class="operation-kpi"><span>停滞项目</span><strong id="mStalled">—</strong></div>
    </section>
    <section class="operations-layout" id="queue">
      <div>
        <div class="section-head"><div><h2>干预队列</h2><p>高优先级、长时间未更新和待人工评审事项优先。</p></div><span class="badge danger"><span id="attentionLabel">0</span> 项</span></div>
        <div class="queue-toolbar"><input class="input" id="search" placeholder="搜索学生或项目" style="max-width:260px;height:38px"><select class="select" id="priority" style="width:130px;height:38px"><option value="all">全部优先级</option><option value="high">高优先级</option><option value="medium">中优先级</option><option value="normal">一般</option></select><select class="select" id="status" style="width:140px;height:38px"><option value="all">全部状态</option><option value="solution_generated">等待评审</option><option value="revision_required">必须修改</option><option value="ready_to_generate">可以生成</option><option value="collecting">补充资料</option><option value="draft">尚未开始</option></select></div>
        <div class="queue-list" id="queueList"><div class="skeleton-row"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line wide"></div></div></div>
      </div>
      <aside class="operations-inspector" id="inspector"><div class="operations-empty"><div class="empty-icon"><i data-lucide="mouse-pointer-click"></i></div><p>选择一项查看学生资料、证据、成果和任务。</p></div></aside>
    </section>
  </div></main>
</div>
<nav class="mobile-nav" aria-label="移动端导航"><a class="active" href="#queue"><i data-lucide="list-todo"></i><span>队列</span></a><a href="#metrics"><i data-lucide="chart-no-axes-combined"></i><span>进度</span></a><a href="/static/governance.html"><i data-lucide="gauge"></i><span>治理</span></a><a href="/admin"><i data-lucide="settings-2"></i><span>设置</span></a></nav>
<div class="toast-stack" id="toastStack"></div>
<script src="/static/vendor/lucide.min.js"></script><script src="/static/ui.js"></script>
<script>
const $=selector=>document.querySelector(selector);
let operations=null,dashboard=null,queue=[],selected=null,currentDetail=null;
const statusLabel={draft:'尚未开始',collecting:'补充资料',ready_to_generate:'可以生成',solution_generated:'等待评审',reviewed:'进入修改',revision_required:'必须修改',completed:'已完成',profile:'建立画像',track:'目标确认',review:'严格评审',revised:'已修订'};
function esc(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function toast(message,icon='check'){CareerUI.toast(message,icon)}
async function api(url,opt={}){const response=await fetch(url,{...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='/login?next=/teacher';throw new Error('请先登录')}if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'请求失败');return data}
function priorityClass(value){return Number(value)>=90?'high':Number(value)>=60?'medium':'normal'}
function priorityLabel(value){return Number(value)>=90?'高':Number(value)>=60?'中':'一般'}
function normalizeQueue(){
  const projectItems=(operations?.queue||[]).map(item=>({...item,source:'project'}));
  const seen=new Set(projectItems.map(item=>item.session_id));
  const legacy=(dashboard?.sessions||[]).filter(item=>!seen.has(item.session_id)&&item.risk_flags?.length).map(item=>({project_id:'',session_id:item.session_id,student_user_id:'',student_name:item.name,project_name:item.target_job||'职业发展会话',status:item.stage,reasons:item.risk_flags,priority:item.risk_flags.some(reason=>reason.includes('致命')||reason.includes('低于70'))?100:65,missing_question_ids:[],stale_days:0,updated_at:item.updated_at,source:'session'}));
  queue=[...projectItems,...legacy].sort((a,b)=>Number(b.priority)-Number(a.priority)||Number(b.stale_days)-Number(a.stale_days));
}
function renderMetrics(){
  const metrics=operations?.metrics||{};const stats=dashboard?.stats||{};
  $('#mStudents').textContent=metrics.active_students??stats.total_students??0;$('#mAttention').textContent=queue.length;$('#mReady').textContent=metrics.ready_to_generate??0;$('#mReview').textContent=metrics.awaiting_review??Math.max(0,(stats.drafted||0)-(stats.reviewed||0));$('#mRevision').textContent=metrics.revision_required??0;$('#mStalled').textContent=metrics.stalled??0;$('#queueCount').textContent=queue.length;$('#attentionLabel').textContent=queue.length;
}
function filteredQueue(){
  const query=$('#search').value.trim().toLowerCase(),priority=$('#priority').value,status=$('#status').value;
  return queue.filter(item=>{const hay=[item.student_name,item.project_name,...(item.reasons||[])].join(' ').toLowerCase();if(query&&!hay.includes(query))return false;if(priority!=='all'&&priorityClass(item.priority)!==priority)return false;if(status!=='all'&&item.status!==status)return false;return true});
}
function renderQueue(){
  const items=filteredQueue();$('#queueList').innerHTML=items.length?items.map(item=>`<article class="queue-item" data-session="${esc(item.session_id)}"><div class="queue-priority ${priorityClass(item.priority)}">${priorityLabel(item.priority)}</div><div class="queue-student"><strong>${esc(item.student_name)}</strong><span>${esc(item.project_name||'职业项目')}</span></div><div class="queue-reason"><strong>${esc((item.reasons||[])[0]||'需要关注')}</strong><span>${esc((item.reasons||[]).slice(1).join(' · ')||`${item.stale_days||0} 天未更新`)}</span></div><span class="badge">${esc(statusLabel[item.status]||item.status)}</span></article>`).join(''):`<div class="operations-empty"><div class="empty-icon"><i data-lucide="circle-check-big"></i></div><p>当前筛选条件下没有待处理事项。</p></div>`;
  document.querySelectorAll('[data-session]').forEach(row=>row.onclick=()=>openInspector(row.dataset.session));CareerUI.refreshIcons();
}
async function openInspector(sessionId){
  selected=queue.find(item=>item.session_id===sessionId)||null;$('#inspector').innerHTML='<div class="skeleton-row"><div class="skeleton skeleton-line wide"></div></div>';
  try{currentDetail=await api('/api/teacher/sessions/'+encodeURIComponent(sessionId));renderInspector()}catch(error){$('#inspector').innerHTML=`<div class="operations-empty"><p>${esc(error.message)}</p></div>`}
}
function renderInspector(){
  const state=currentDetail.state||{},profile=state.profile||{},risks=currentDetail.risk_flags||[],artifacts=currentDetail.artifacts||[],evidence=currentDetail.evidence||[],tasks=currentDetail.tasks||[];
  $('#inspector').innerHTML=`<div class="eyebrow">学生与项目</div><h2 style="margin-top:8px">${esc(profile.name||selected?.student_name||'未命名学生')}</h2><p class="secondary">${esc([profile.school,profile.major,profile.grade].filter(Boolean).join(' · ')||'画像待完善')}</p>
    <div class="reason-list">${(selected?.reasons||risks).map(reason=>`<div class="reason">${esc(reason)}</div>`).join('')||'<div class="reason">当前没有规则风险</div>'}</div>
    <div class="mini-stat"><span>目标岗位</span><strong>${esc(profile.target_job||'未明确')}</strong></div><div class="mini-stat"><span>证据</span><strong>${evidence.length} 项</strong></div><div class="mini-stat"><span>成果版本</span><strong>${artifacts.length}</strong></div><div class="mini-stat"><span>开放任务</span><strong>${tasks.filter(task=>!['done','completed','cancelled'].includes(task.status)).length}</strong></div>
    <div class="inspector-section"><div class="eyebrow">教师备注</div><textarea class="textarea" id="note" style="margin-top:8px" placeholder="仅供教师团队内部使用">${esc(state.teacher_note||'')}</textarea><button class="btn small" id="saveNote" style="margin-top:8px"><i data-lucide="save"></i>保存备注</button></div>
    <div class="inspector-section"><div class="eyebrow">给学生的反馈</div><textarea class="textarea" id="feedback" style="margin-top:8px" placeholder="明确指出需要补充或修改的具体内容"></textarea><div style="display:flex;gap:7px;margin-top:8px"><select class="select" id="feedbackPriority" style="height:34px"><option value="normal">一般</option><option value="medium">中优先级</option><option value="high">高优先级</option></select><button class="btn small primary" id="sendFeedback">发送反馈</button></div></div>
    <div class="inspector-section"><div class="eyebrow">运营动作</div><div style="display:grid;gap:7px;margin-top:8px"><button class="btn" id="createReminder"><i data-lucide="list-plus"></i>建立跟进任务</button>${selected?.project_id?`<a class="btn" href="/projects/${esc(selected.project_id)}"><i data-lucide="folder-open"></i>查看项目</a>`:''}</div></div>`;
  $('#saveNote').onclick=saveNote;$('#sendFeedback').onclick=sendFeedback;$('#createReminder').onclick=createReminder;CareerUI.refreshIcons();
}
async function saveNote(){try{await api('/api/teacher/sessions/'+encodeURIComponent(selected.session_id)+'/note',{method:'PUT',body:JSON.stringify({note:$('#note').value})});toast('备注已保存')}catch(error){toast(error.message,'triangle-alert')}}
async function sendFeedback(){const content=$('#feedback').value.trim();if(!content){toast('请输入具体反馈','triangle-alert');return}try{await api('/api/teacher/sessions/'+encodeURIComponent(selected.session_id)+'/feedback',{method:'POST',body:JSON.stringify({content,priority:$('#feedbackPriority').value,teacher_name:'Advisor'})});toast('反馈已发送并建立学生任务');$('#feedback').value='';await openInspector(selected.session_id)}catch(error){toast(error.message,'triangle-alert')}}
async function createReminder(){try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:`跟进：${selected.student_name} · ${(selected.reasons||[])[0]||'职业项目'}`,task_type:'advisor_follow_up',session_id:selected.session_id,priority:priorityClass(selected.priority)==='high'?'high':priorityClass(selected.priority)==='medium'?'medium':'normal',payload:{project_id:selected.project_id||'',reasons:selected.reasons||[]}})});toast('跟进任务已建立');await openInspector(selected.session_id)}catch(error){toast(error.message,'triangle-alert')}}
async function createGeneralTask(){const title=prompt('输入运营任务名称');if(!title)return;try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title,task_type:'operations',session_id:'',priority:'normal',payload:{}})});toast('运营任务已建立')}catch(error){toast(error.message,'triangle-alert')}}
async function load(){
  try{const [health,me,ops,dash]=await Promise.all([api('/api/health'),api('/api/auth/me'),api('/api/v1/advisor/operations'),api('/api/teacher/dashboard')]);operations=ops;dashboard=dash;const name=me.user?.display_name||'Advisor',initial=(name.trim()[0]||'A').toUpperCase();$('#advisorName').textContent=name;$('#advisorAvatar').textContent=initial;$('#topAvatar').textContent=initial;$('#mode').textContent=health.mode==='demo'?'Demo':health.mode==='hybrid'?'Hybrid':'Live';normalizeQueue();renderMetrics();renderQueue();$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
  }catch(error){toast(error.message,'triangle-alert');$('#queueList').innerHTML=`<div class="operations-empty"><p>${esc(error.message)}</p></div>`}CareerUI.refreshIcons();
}
['input','change'].forEach(event=>{$('#search').addEventListener(event,renderQueue);$('#priority').addEventListener(event,renderQueue);$('#status').addEventListener(event,renderQueue)});
$('#refresh').onclick=load;$('#createGeneralTask').onclick=createGeneralTask;$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});location.href='/login'}catch(error){toast(error.message,'triangle-alert')}};
CareerUI.initTheme();CareerUI.refreshIcons();load();
</script>
</body>
</html>
