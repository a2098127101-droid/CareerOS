<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础成长 · StepIn</title>
<style>
:root{--bg:#f6f5f1;--paper:#fffefa;--ink:#202822;--muted:#6a736d;--line:#dddcd5;--accent:#315d4d;--soft:#e9f0ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.top a{color:var(--muted);text-decoration:none}.top h1{font-size:25px;margin:0 auto 0 0}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:18px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;margin:0}.panel-head p{color:var(--muted);margin:4px 0 0}.list{max-height:calc(100vh - 165px);overflow:auto}.student{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.student:hover,.student.active{background:var(--soft)}.student strong{display:block}.student span{color:var(--muted);font-size:12px}.detail{padding:24px}.empty{color:var(--muted);padding:50px;text-align:center}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:12px}.ability{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px;align-items:center}.level{display:inline-block;border-radius:999px;background:var(--soft);padding:3px 8px;font-size:12px}.step{border-left:2px solid #d8ddd9;padding:0 0 15px 14px;margin-left:6px}.step:last-child{padding-bottom:0}.step b{display:block}.step small{color:var(--muted)}.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:10px;background:white}@media(max-width:820px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.ability{grid-template-columns:1fr 1fr}.list{max-height:none}}
</style>
</head><body><div class="shell"><div class="top"><a href="/teacher">← 教师工作台</a><h1>基础成长</h1><button id="refresh">刷新</button></div><div class="layout"><section class="panel"><div class="panel-head"><h2>学生</h2><p>看学生从“需要提示”到“能自己做”的变化。</p><input class="search" id="search" placeholder="搜索学生"></div><div class="list" id="students"><div class="empty">正在读取…</div></div></section><section class="panel"><div class="detail" id="detail"><div class="empty">选择一名学生查看成长过程。</div></div></section></div></div><script>
const $=s=>document.querySelector(s);let rows=[],selected='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/login?next=/static/foundation-teacher.html';throw new Error('请先登录')}if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'请求失败');return d}
function itemStage(x){if(x.professionalUnlocked)return'professional_ready';if(x.foundationComplete)return'expression';return'foundation'}
function renderList(){const q=$('#search').value.trim().toLowerCase();const items=rows.filter(x=>[x.name,x.userId,itemStage(x)].join(' ').toLowerCase().includes(q));$('#students').innerHTML=items.length?items.map(x=>`<div class="student ${selected===x.userId?'active':''}" data-id="${esc(x.userId)}"><strong>${esc(x.name||x.userId)}</strong><span>基础 ${x.completed||0}/${x.total||8} · ${esc(labelStage(itemStage(x)))}</span></div>`).join(''):'<div class="empty">没有找到学生。</div>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openStudent(el.dataset.id))}
function labelStage(v){return({beginner:'基础练习',foundation:'基础练习',expression:'讲清楚',exploration:'换材料再做',professional_ready:'基础阶段完成'}[v]||v||'刚开始')}
function levelText(v){return({not_started:'还没开始',guided:'能跟着做',assisted:'少提示能做',independent:'能自己做',transfer:'换一种情况也能做',stable:'比较稳定'}[v]||v||'刚开始')}
async function openStudent(id){selected=id;renderList();$('#detail').innerHTML='<div class="empty">正在读取…</div>';try{const d=await api('/api/foundation/v1/growth/'+encodeURIComponent(id));const row=rows.find(x=>x.userId===id)||{};renderDetail(d,row)}catch(e){$('#detail').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderDetail(d,row){const s=d.summary||{},abilities=s.abilities||[],steps=d.timeline||[];const hints=steps.reduce((n,x)=>n+Number(x.hintsUsed||0),0);$('#detail').innerHTML=`<h2 style="margin-top:0">${esc(row.name||row.userId||'学生')}</h2><p style="color:var(--muted)">现在：${esc(labelStage(s.mode))}</p><div class="summary"><div class="metric"><b>${s.completed??0}/${s.total??8}</b><span>基础小步</span></div><div class="metric"><b>${hints}</b><span>使用提示</span></div><div class="metric"><b>${s.exploration?.completed??0}/3</b><span>换材料再做</span></div><div class="metric"><b>${s.professionalUnlocked?'已完成':'进行中'}</b><span>基础阶段</span></div></div><h3>现在会做什么</h3>${abilities.length?abilities.map(a=>`<div class="ability"><b>${esc(a.name||a.id)}</b><span class="level">${esc(levelText(a.level))}</span><span>${Number(a.independent||0)} 次独立</span><span>${Number(a.transfer||0)} 次换场景</span></div>`).join(''):'<p style="color:var(--muted)">还没有足够记录。</p>'}<h3 style="margin-top:26px">最近怎么做的</h3>${steps.length?steps.slice(-8).reverse().map(x=>`<div class="step"><b>${esc(x.title||x.taskId||'基础练习')}</b><small>${x.hintsUsed??0} 次提示 · 完成度 ${Math.round(Number(x.score||0)*100)}%${x.completedAt?' · '+esc(String(x.completedAt).replace('T',' ').slice(0,16)):''}</small></div>`).join(''):'<p style="color:var(--muted)">还没有完成记录。</p>'}`}
async function load(){try{const d=await api('/api/foundation/v1/cohort');rows=d.items||[];renderList();if(rows.length&&!selected)openStudent(rows[0].userId)}catch(e){$('#students').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('#search').oninput=renderList;$('#refresh').onclick=load;load();
</script></body></html>
