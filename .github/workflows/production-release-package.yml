name: CareerOS Production Release Package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.5.0-rc1
        required: true
        default: v1.5.0-rc1
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Validate deployment inputs
        run: |
          python -m compileall -q app scripts alembic
          bash -n deploy/postgres/init-app-role.sh deploy/scripts/*.sh
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            value="v1.5.0-pr${PR_NUMBER}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            value="$INPUT_VERSION"
          else
            value="$REF_NAME"
          fi
          value="${value//\//-}"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build sanitized deterministic ZIP
        run: python scripts/build_production_release.py --version "${{ steps.version.outputs.value }}" --out-dir dist
      - name: Verify checksum and archive boundaries
        shell: bash
        run: |
          sha256sum --check dist/CareerOS-*.zip.sha256
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          manifests = list(Path('dist').glob('CareerOS-*.manifest.json'))
          archives = list(Path('dist').glob('CareerOS-*.zip'))
          assert len(manifests) == 1 and len(archives) == 1
          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          boundary = manifest['release_boundary']
          assert boundary['contains_secrets'] is False
          assert boundary['contains_runtime_database'] is False
          assert boundary['contains_student_data'] is False
          assert boundary['runtime_verified'] is False
          assert boundary['verification_required_after_deployment'] is True
          forbidden = {'.env.production', '.env.staging', 'agent.db'}
          with zipfile.ZipFile(archives[0]) as package:
              names = package.namelist()
          assert not any(Path(name).name in forbidden for name in names)
          assert any(name.endswith('/deploy/docker-compose.production.yml') for name in names)
          assert any(name.endswith('/RELEASE_MANIFEST.json') for name in names)
          print(json.dumps({'archive': str(archives[0]), 'files': manifest['file_count']}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: careeros-production-${{ steps.version.outputs.value }}
          path: |
            dist/CareerOS-*.zip
            dist/CareerOS-*.zip.sha256
            dist/CareerOS-*.manifest.json
          if-no-files-found: error
          retention-days: 30
