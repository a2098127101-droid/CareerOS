name: StepIn Production Release Package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override, for example v2.2.0-rc1
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Audit canonical StepIn release baseline
        run: python scripts/audit_release_baseline.py
      - name: Build spatial frontend for release
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          npm run typecheck
          npm run build
      - name: Validate spatial bundle entry
        run: test -f app/static/app/index.html
      - name: Validate deployment inputs
        run: |
          python -m compileall -q app scripts alembic
          bash -n deploy/postgres/init-app-role.sh deploy/scripts/*.sh
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base_version="$(python -c "import json; print(json.load(open('config/stepin_release_baseline.json', encoding='utf-8'))['product_version'])")"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            value="v${base_version}-pr${PR_NUMBER}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            value="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            value="$REF_NAME"
          else
            value="v${base_version}-rc"
          fi
          value="${value//\//-}"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build sanitized deterministic ZIP
        run: python scripts/build_production_release.py --version "${{ steps.version.outputs.value }}" --out-dir dist
      - name: Verify checksum and archive boundaries
        shell: bash
        run: |
          (cd dist && sha256sum --check StepIn-*.zip.sha256)
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          manifests = list(Path('dist').glob('StepIn-*.manifest.json'))
          archives = list(Path('dist').glob('StepIn-*.zip'))
          assert len(manifests) == 1 and len(archives) == 1
          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          baseline = json.loads(Path('config/stepin_release_baseline.json').read_text(encoding='utf-8'))
          assert manifest['stepin_baseline'] == baseline
          boundary = manifest['release_boundary']
          assert boundary['contains_secrets'] is False
          assert boundary['contains_runtime_database'] is False
          assert boundary['contains_student_data'] is False
          assert boundary['runtime_verified'] is False
          assert boundary['verification_required_after_deployment'] is True
          forbidden = {'.env.production', '.env.staging', 'agent.db'}
          with zipfile.ZipFile(archives[0]) as package:
              names = package.namelist()
          assert not any(Path(name).name in forbidden for name in names)
          assert any(name.endswith('/deploy/docker-compose.production.yml') for name in names)
          assert any(name.endswith('/app/static/app/index.html') for name in names)
          assert any(name.endswith('/config/stepin_release_baseline.json') for name in names)
          assert any(name.endswith('/RELEASE_MANIFEST.json') for name in names)
          print(json.dumps({'archive': str(archives[0]), 'files': manifest['file_count'], 'baseline': baseline}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stepin-production-${{ steps.version.outputs.value }}
          path: |
            dist/StepIn-*.zip
            dist/StepIn-*.zip.sha256
            dist/StepIn-*.manifest.json
          if-no-files-found: error
          retention-days: 30
