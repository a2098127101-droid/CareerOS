name: CareerOS Production Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0-rc1
        required: true
        default: v1.0.0-rc1
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Static and repository checks
        run: |
          python -m pip check
          python -m compileall -q app scripts tests
          python scripts/audit_database_access.py --json-out docs/RELEASE_DATABASE_ACCESS_AUDIT.json
          python scripts/audit_repository_contract.py --json-out docs/RELEASE_REPOSITORY_CONTRACT_AUDIT.json
      - name: Test suite
        run: pytest -q
      - name: Validate production compose model
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Build sanitized release package
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          python scripts/build_production_release.py --version "$VERSION" --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: careeros-production-release
          path: |
            dist/CareerOS-*.zip
            dist/CareerOS-*.zip.sha256
            dist/CareerOS-*.manifest.json
            docs/RELEASE_*_AUDIT.json
          if-no-files-found: error
          retention-days: 30
