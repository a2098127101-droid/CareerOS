name: CareerOS CI (StepIn v2.2 bootstrap)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply staged StepIn v2.2 source patch
        if: github.ref == 'refs/heads/feat/stepin-agent-real-trajectory' && hashFiles('tools/.agent-v22-patch.part1') != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          cat tools/.agent-v22-patch.part1 tools/.agent-v22-patch.part2 tools/.agent-v22-patch.part3a tools/.agent-v22-patch.part3b tools/.agent-v22-patch.part4 \
            | base64 -d | gzip -d > /tmp/agent-v22.patch
          echo '22eef1d356b6ef7b1f86657103a550add2c1e57ddeb1d6e37155d2b886d8b4ee  /tmp/agent-v22.patch' | sha256sum -c -
          git apply --check /tmp/agent-v22.patch
          git apply /tmp/agent-v22.patch
          # The Actions token deliberately cannot change workflow files. Keep the
          # branch's current workflows untouched; an authorized maintainer updates
          # them separately after the application source commit lands.
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -f tools/.agent-v22-patch.part1 tools/.agent-v22-patch.part2 tools/.agent-v22-patch.part3 tools/.agent-v22-patch.part3a tools/.agent-v22-patch.part3b tools/.agent-v22-patch.part4
          rm -f tools/.agent-v22-trigger
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect Learner Agent to real practice trajectories'
          git push origin HEAD:feat/stepin-agent-real-trajectory
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile application, migrations and tests
        run: python -m compileall -q app scripts tests alembic
      - name: Validate deployment shell scripts
        run: bash -n deploy/postgres/init-app-role.sh deploy/scripts/*.sh
      - name: Validate production Compose model
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Audit database access boundaries
        run: python scripts/audit_database_access.py --json-out docs/CI_DATABASE_ACCESS_AUDIT.json
      - name: Audit repository contracts
        run: python scripts/audit_repository_contract.py --json-out docs/CI_REPOSITORY_CONTRACT_AUDIT.json
      - name: Audit StepIn Foundation production contract
        run: python scripts/audit_foundation_production.py
      - name: Audit StepIn Learner Agent contract
        run: python scripts/audit_learner_agent.py
      - name: Audit StepIn project library when present
        run: test ! -f scripts/audit_stepin_project_library.py || python scripts/audit_stepin_project_library.py
      - name: Run isolated regression matrix
        run: python scripts/run_test_matrix.py --timeout 180 --json-out docs/CI_TEST_MATRIX.json
      - name: Enforce expected test count
        run: python -c "import json; report=json.load(open('docs/CI_TEST_MATRIX.json', encoding='utf-8')); expected=204 if '${{ github.ref }}' == 'refs/heads/feat/stepin-agent-real-trajectory' else 197; assert report['ok'] and report['passed_tests'] == expected, (expected, report)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: careeros-ci-reports
          path: docs/CI_*.json
          if-no-files-found: warn
          retention-days: 14
