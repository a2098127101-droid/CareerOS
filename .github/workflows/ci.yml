name: StepIn CI (canonical baseline + spatial UI)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile application, migrations and tests
        run: python -m compileall -q app scripts tests alembic
      - name: Audit canonical StepIn release baseline
        run: python scripts/audit_release_baseline.py
      - name: Validate deployment shell scripts
        run: bash -n deploy/postgres/init-app-role.sh deploy/scripts/*.sh
      - name: Validate production Compose model
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Audit database access boundaries
        run: python scripts/audit_database_access.py --json-out docs/CI_DATABASE_ACCESS_AUDIT.json
      - name: Audit repository contracts
        run: python scripts/audit_repository_contract.py --json-out docs/CI_REPOSITORY_CONTRACT_AUDIT.json
      - name: Audit StepIn Foundation production contract
        run: python scripts/audit_foundation_production.py
      - name: Audit StepIn Learner Agent contract
        run: python scripts/audit_learner_agent.py
      - name: Audit StepIn project library
        run: python scripts/audit_stepin_project_library.py
      - name: Run isolated regression matrix
        run: python scripts/run_test_matrix.py --timeout 180 --json-out docs/CI_TEST_MATRIX.json
      - name: Enforce canonical locked test count
        shell: bash
        run: |
          python - <<'PY'
          import json
          baseline = json.load(open('config/stepin_release_baseline.json', encoding='utf-8'))
          report = json.load(open('docs/CI_TEST_MATRIX.json', encoding='utf-8'))
          expected = int(baseline['locked_tests'])
          assert report['ok'] and report['passed_tests'] == expected, {'expected': expected, 'report': report}
          print({'locked_tests': expected, 'passed_tests': report['passed_tests']})
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stepin-ci-reports
          path: docs/CI_*.json
          if-no-files-found: warn
          retention-days: 14

  spatial-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install spatial frontend dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile integrity
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Type-check spatial frontend
        run: npm run typecheck
      - name: Build spatial frontend
        run: npm run build
      - name: Verify FastAPI spatial bundle entry
        working-directory: .
        run: test -f app/static/app/index.html
