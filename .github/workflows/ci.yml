name: CareerOS CI (manifest-driven regression gate)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m compileall -q app scripts tests alembic
      - run: python scripts/audit_database_access.py --json-out docs/CI_DATABASE_ACCESS_AUDIT.json
      - run: python scripts/audit_repository_contract.py --json-out docs/CI_REPOSITORY_CONTRACT_AUDIT.json
      - run: python -c "from pathlib import Path; a=Path('CareerOS_H5_Showcase.html').read_bytes(); b=Path('app/static/showcase.html').read_bytes(); assert a==b"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: careeros-static-audit
          path: docs/CI_*.json

  pytest-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Run deterministic pytest group
        shell: bash
        run: |
          FILES="$(python scripts/select_test_group.py --groups 6 --index ${{ matrix.group }})"
          echo "Running group ${{ matrix.group }}: ${FILES}"
          pytest -q ${FILES}
