name: Reconcile v1.5 Production Integration

on:
  push:
    branches:
      - codex/v1.5-production-integration
    paths:
      - .integration/reconcile-v15-production.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: codex/v1.5-production-integration
      - name: Fetch integration sources
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin codex/production-launch-hardening:refs/remotes/origin/codex/production-launch-hardening
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Reconcile project, domain-intelligence and production layers
        run: python scripts/reconcile_v15_production.py
      - name: Validate deployment model
        run: |
          bash -n deploy/postgres/init-app-role.sh deploy/scripts/*.sh
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Repository audits
        run: |
          python scripts/audit_database_access.py --json-out docs/INTEGRATION_DATABASE_ACCESS_AUDIT.json
          python scripts/audit_repository_contract.py --json-out docs/INTEGRATION_REPOSITORY_CONTRACT_AUDIT.json
      - name: Full regression suite
        run: pytest -q
      - name: Commit reconciled tree
        run: |
          git config user.name "CareerOS Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconciliation changes to commit."
            exit 0
          fi
          git commit -m "feat: reconcile v1.5 domain intelligence with production launch"
          git push origin HEAD:codex/v1.5-production-integration
