name: Reconcile CareerOS v1.5 Production Final

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile-and-verify:
    if: github.head_ref == 'codex/v1.5-production-final'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: codex/v1.5-production-final
      - name: Fetch controlled source branches
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin agent/release-v1.5-domain-intelligence:refs/remotes/origin/agent/release-v1.5-domain-intelligence
          git fetch origin codex/production-launch-hardening:refs/remotes/origin/codex/production-launch-hardening
          git fetch origin codex/v1.5-production-integration:refs/remotes/origin/codex/v1.5-production-integration
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install baseline locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Apply controlled reconciliation
        run: python scripts/reconcile_v15_final.py
      - name: Align regression contracts and async test lock
        run: python scripts/fix_v15_integration_regressions.py
      - name: Install reconciled locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Validate deployment syntax and Compose model
        run: |
          bash -n deploy/postgres/init-app-role.sh deploy/scripts/*.sh
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm -f deploy/.env.production
      - name: Run repository audits
        run: |
          python scripts/audit_database_access.py --json-out docs/FINAL_DATABASE_ACCESS_AUDIT.json
          python scripts/audit_repository_contract.py --json-out docs/FINAL_REPOSITORY_CONTRACT_AUDIT.json
      - name: Materialize integration candidate
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "CareerOS Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          # The default Actions token cannot create or update workflow files. Keep those
          # generated changes in the working tree for validation, but commit application,
          # migration, deployment, test and documentation changes separately.
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            echo "Integration candidate code is already materialized."
            exit 0
          fi
          git commit -m "chore: materialize v1.5 production integration candidate"
          git push origin HEAD:codex/v1.5-production-final
      - name: Run complete regression suite
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=50 --junitxml=docs/FINAL_PYTEST.xml 2>&1 | tee docs/FINAL_PYTEST.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: careeros-v15-integration-diagnostics
          path: |
            docs/FINAL_DATABASE_ACCESS_AUDIT.json
            docs/FINAL_REPOSITORY_CONTRACT_AUDIT.json
            docs/FINAL_PYTEST.xml
            docs/FINAL_PYTEST.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce regression result
        if: steps.regression.outputs.status != '0'
        run: |
          echo "The reconciled candidate has regression failures."
          tail -n 240 docs/FINAL_PYTEST.log || true
          exit 1
      - name: Confirm verified reconciliation
        run: echo "Reconciled candidate passed audits, deployment validation and the complete regression suite."
