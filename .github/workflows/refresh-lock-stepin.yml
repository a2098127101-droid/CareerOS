name: StepIn temporary dependency lock refresh

on:
  push:
    branches:
      - integration/stepin-foundation-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Install pip-tools
        run: python -m pip install 'pip-tools>=7.4,<8'
      - name: Regenerate hash-locked dependencies
        run: pip-compile --generate-hashes --output-file=requirements.lock --strip-extras requirements.txt
      - name: Confirm patched versions
        run: |
          grep '^cryptography==50.0.0' requirements.lock
          grep '^pypdf==6.15.0' requirements.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stepin-refreshed-requirements-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 2
