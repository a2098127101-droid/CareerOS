name: CareerOS supply-chain security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit hash-locked dependencies
        run: >-
          pip-audit --requirement requirements.lock --require-hashes
          --disable-pip --strict --format json
          --output pip-audit.json
      - name: Generate Python CycloneDX SBOM
        run: >-
          pip-audit --requirement requirements.lock --require-hashes
          --disable-pip --strict --format cyclonedx-json
          --output careeros-python.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-audit-and-sbom
          path: |
            pip-audit.json
            careeros-python.cdx.json
          if-no-files-found: warn

  repository-and-container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan repository vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build release container
        run: docker build --tag "careeros:${GITHUB_SHA}" .
      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: careeros:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: careeros:${{ github.sha }}
          format: cyclonedx
          output: careeros-container.cdx.json
          exit-code: '0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-scans-and-container-sbom
          path: |
            trivy-filesystem.sarif
            trivy-container.sarif
            careeros-container.cdx.json
          if-no-files-found: warn

  source-provenance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create source archive
        run: git archive --format=tar.gz --output="careeros-source-${GITHUB_SHA}.tar.gz" HEAD
      - name: Attest source archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: careeros-source-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-source-archive
          path: careeros-source-${{ github.sha }}.tar.gz
