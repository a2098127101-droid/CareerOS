name: StepIn frontend lockfile integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Generate lockfile candidate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Capture lockfile status
        id: lock
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            echo 'dirty=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dirty=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stepin-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce committed lockfile
        if: steps.lock.outputs.dirty == 'true'
        run: |
          echo 'frontend/package-lock.json is missing or out of date.' >&2
          git status --short -- package-lock.json
          exit 1
      - name: Verify deterministic install
        if: steps.lock.outputs.dirty == 'false'
        run: npm ci --ignore-scripts --no-audit --no-fund
