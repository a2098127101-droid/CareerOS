services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: careeros
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - careeros_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d careeros"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  careeros_postgres:
